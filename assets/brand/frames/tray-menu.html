<!DOCTYPE html>
<!-- Real tray menu capture (src/menu.png, French UI), cropped to the menu card and staged above a tray. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand.css"><link rel="stylesheet" href="frame.css">
<style>
  /* menu.png is 392x240; the menu card sits at ~(36,36) 320x168. Shown at 1.25x. */
  .card.menu { left: 440px; top: 128px; width: 400px; height: 210px; border-radius: 10px; }
  .card.menu img { width: 490px; left: -45px; top: -45px; }
  .bar {
    position: absolute; left: 120px; right: 120px; top: 410px; height: 52px; border-radius: 12px;
    background: rgba(22,23,26,.92); border: 1px solid var(--line-strong);
    display: flex; align-items: center; padding: 0 16px; gap: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .bar span { width: 26px; height: 26px; border-radius: 7px; background: rgba(255,255,255,.12); }
  .bar .tray { margin-left: auto; display: flex; align-items: center; gap: 14px; font: 400 13px var(--font-text); color: var(--dim); }
  .bar .tray span { width: 14px; height: 14px; border-radius: 3px; background: rgba(255,255,255,.28); }
  .bar .me { position: relative; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: var(--signal-soft); box-shadow: inset 0 0 0 1px rgba(56,138,240,.55), 0 0 20px rgba(56,138,240,.30); }
  .bar .me img { width: 22px; height: 22px; }
  .pointer { position: absolute; left: 792px; top: 338px; width: 2px; height: 72px;
    background: linear-gradient(180deg, rgba(56,138,240,0), rgba(56,138,240,.85)); }
  .note { position: absolute; left: 150px; top: 180px; width: 230px; text-align: right; font: 400 13px/1.5 var(--font-text); color: var(--dim); }
  .note b { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }
</style></head>
<body>
  <div class="bg"></div><div class="gridlines"></div>
  <div class="tag"><img src="../logo.svg" alt="">DeskToggle <em>/</em> tray menu</div>

  <div class="card menu"><img src="src/menu.png" alt=""></div>
  <div class="pointer"></div>
  <div class="note"><b>Right-click</b>Toggle, taskbar option, hotkey, start with Windows, quit.</div>

  <div class="bar">
    <span style="background:linear-gradient(135deg,var(--signal),#4B8DE0)"></span><span></span><span></span><span></span>
    <div class="tray"><span></span><span></span><div class="me"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="1.5" y="5.5" width="21" height="13" rx="6.5" fill="#388AF0"/><circle cx="16" cy="12" r="4.2" fill="#FFFFFF"/></svg></div>02:26</div>
  </div>
  <p class="caption"><b>Left-click toggles, right-click opens the menu.</b> The tray icon only shows while the desktop is in front. Actual capture, French UI.</p>
  <div class="grain"></div>
</body></html>
